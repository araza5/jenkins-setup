name: jenkins-setup
services:
  jenkins:
    build:
      context: .
    container_name: jenkins
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: